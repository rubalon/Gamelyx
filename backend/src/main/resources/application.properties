# Este archivo no puede contener acentos ni caracteres especiales
# application.properties - ESTE ARCHIVO SE SUBE A GITHUB

spring.application.name=Gamelyx-Backend

# PostgreSQL Database Configuration - Environment Variables
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gamelyx}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.mail=DEBUG

# JWT Configuration - Environment Variables (12-Factor App compliant)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:86400}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800}

# Email/SMTP Configuration - Environment Variables
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Email Application Configuration
app.email.from=${EMAIL_USERNAME:}
app.email.name=Gamelyx
app.email.verification.expiration=86400
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# ================================
# GAME APIs CONFIGURATION
# ================================

# RAWG Video Games Database API (Primary)
rawg.api.baseurl=https://api.rawg.io/api
game.rawg.key=${RAWG_API_KEY}
rawg.api.timeout=10000
rawg.api.retry.max-attempts=3
rawg.api.retry.delay=1000

# Steam Web API (Backup)
steam.api.baseurl=https://api.steampowered.com
game.steam.key=${STEAM_API_KEY}
steam.api.timeout=5000
steam.api.retry.max-attempts=2
steam.api.retry.delay=500

# Game Search Configuration
game.search.default-page-size=20
game.search.max-page-size=100
game.search.cache.ttl=3600

# Cache Configuration for Games
spring.cache.type=simple
