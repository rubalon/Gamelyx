spring.application.name=Gamelyx-Backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/gamelyx
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging para debug de seguridad (opcional, solo desarrollo)
logging.level.org.springframework.security=DEBUG

# IMPORTANTE: En produccion, usar una clave mas segura y desde variables de entorno
# Clave secreta JWT (minimo 256 bits - 32 caracteres)
app.jwt.secret=GamelyxSecretKeyForJWTTokenGeneration2025SuperSecure

# Tiempo de expiracion del token en segundos (24 horas = 86400)
app.jwt.expiration=86400

# Tiempo de expiracion del refresh token en segundos (7 dias = 604800)
app.jwt.refresh-expiration=604800