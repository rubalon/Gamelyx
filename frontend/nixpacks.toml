# frontend/nixpacks.toml
# Configuración simplificada para evitar problemas de cache en Railway

[phases.setup]
# Usar un commit específico de nixpkgs que incluye Node.js 22.13+
nixpkgsArchive = "51ad838b03a05b1de6f9f2a0fffecee64a9788ee"

[phases.install]
# Instalación limpia de dependencias sin usar cache
cmds = ["npm ci --legacy-peer-deps"]

[phases.build]
# Build directo sin referencias a cache
cmds = ["npm run build"]

[start]
# Servir la aplicación con variable de entorno PORT
cmd = "npx serve dist/gamelyx -s -l $PORT"