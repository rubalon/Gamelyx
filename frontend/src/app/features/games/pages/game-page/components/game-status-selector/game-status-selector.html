<!-- src/app/features/games/pages/game-page/components/game-status-selector/game-status-selector.html -->
<div class="bg-gray-800 rounded-xl p-4 sm:p-6 border border-gray-700">
  <!-- Título de la sección -->
  <h3 class="text-lg sm:text-xl font-bold text-white mb-4">
    {{ 'games.status.title' | translate }}
  </h3>
  
  <!-- Grid de botones de estado - 2x2 en móvil, 4x1 en desktop -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 sm:gap-3">
    @for (option of statusOptions; track option.value) {
      <button
        (click)="onStatusClick(option.value)"
        [disabled]="isUpdating()"
        [class]="'relative flex flex-col items-center justify-center p-3 sm:p-4 rounded-lg border-2 transition-all duration-200 ' + getStatusButtonClass(option.value) + (isUpdating() ? ' opacity-50 cursor-not-allowed' : '')"
        [attr.aria-pressed]="selectedStatus() === option.value"
        [attr.aria-label]="option.labelKey | translate"
      >
        <!-- Icono -->
        <svg 
          class="w-6 h-6 sm:w-8 sm:h-8 mb-1 sm:mb-2" 
          fill="none" 
          stroke="currentColor" 
          viewBox="0 0 24 24"
          stroke-width="2"
        >
          <path 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            [attr.d]="getIconPath(option.icon)"
          />
        </svg>
        
        <!-- Label del estado -->
        <span class="text-xs sm:text-sm font-medium text-center">
          {{ option.labelKey | translate }}
        </span>
        
        <!-- Indicador visual de selección (checkbox) -->
        @if (selectedStatus() === option.value) {
          <div class="absolute top-1 right-1 sm:top-2 sm:right-2">
            <svg 
              class="w-4 h-4 sm:w-5 sm:h-5 text-white" 
              fill="currentColor" 
              viewBox="0 0 20 20"
            >
              <path 
                fill-rule="evenodd" 
                d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" 
                clip-rule="evenodd"
              />
            </svg>
          </div>
        }
        
        <!-- Spinner de carga cuando está actualizando -->
        @if (isUpdating()) {
          <div class="absolute inset-0 flex items-center justify-center bg-gray-900/50 rounded-lg">
            <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" 
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
            </svg>
          </div>
        }
      </button>
    }
  </div>
  
  <!-- Texto informativo opcional -->
  @if (!selectedStatus()) {
    <p class="text-gray-400 text-xs sm:text-sm mt-3 text-center">
      {{ 'games.status.selectHint' | translate }}
    </p>
  }
</div>
