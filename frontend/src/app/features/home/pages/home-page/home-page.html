<!-- src/app/features/home/pages/home-page/home-page.html-->
<!-- Página Home con funcionalidad social -->
<div class="min-h-screen bg-gray-900">
  
  <!-- Header reutilizable -->
  <app-header></app-header>
  
  <!-- Contenido principal con layout de componentes sociales -->
  <main class="pt-8 px-4">
    <div class="max-w-7xl mx-auto">
      
      <!-- Layout Grid Principal según nuevo diseño -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8">
        
        <!-- Columna Izquierda: Search + Friend Finder -->
        <div class="lg:col-span-8 space-y-6">
          
          <!-- 🔍 Search Toggle Component (Juegos/Personas) -->
          <div class="search-section">
            <app-search-toggle></app-search-toggle>
          </div>
          
          <!-- 🔍 Friend Finder Component (Buscar amigos por gustos) -->
          <div class="friend-finder-section">
            <app-friend-finder></app-friend-finder>
          </div>
          
        </div>
        
        <!-- Columna Derecha: Friend List -->
        <div class="lg:col-span-4">
          <div class="friend-list-section">
            <app-friend-list></app-friend-list>
          </div>
        </div>
        
      </div>
      
      <!-- Sección inferior: Friend Requests (aprovecha todo el ancho) -->
      <div class="grid grid-cols-1 gap-6">
        <div class="friend-requests-section">
          <app-friend-request></app-friend-request>
        </div>
      </div>

    </div>
  </main>
</div>
