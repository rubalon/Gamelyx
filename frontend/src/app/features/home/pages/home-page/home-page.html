<!-- src/app/features/home/pages/home-page/home-page.html-->
<div class="min-h-screen bg-gray-900 flex flex-col">
  
  <!-- Header reutilizable -->
  <app-header class="flex-shrink-0"></app-header>
  
  <!-- Contenido principal con layout de componentes sociales -->
  <main class="flex-1 flex flex-col pt-8 px-4 min-h-0">
    <div class="max-w-7xl mx-auto flex-1 flex flex-col">
      
      <!-- Layout Grid Principal según nuevo diseño -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6 flex-1 min-h-0">
        
        <!-- Columna Izquierda: Search + Friend Finder -->
        <div class="lg:col-span-8 flex flex-col space-y-6">
          
          <!-- 🔍 Search Toggle Component (Juegos/Personas) -->
          <div class="search-section flex-shrink-0">
            <app-search-toggle></app-search-toggle>
          </div>
          
          <!-- 🔍 Friend Finder Component (Buscar amigos por gustos) -->
          <div class="friend-finder-section flex-1 min-h-0">
            <app-friend-finder></app-friend-finder>
          </div>
          
        </div>
        
        <!-- Columna Derecha: Friend List - Altura completa -->
        <div class="lg:col-span-4 flex flex-col min-h-0">
          <div class="friend-list-section flex-1 flex flex-col min-h-0">
            <app-friend-list class="flex-1 flex flex-col min-h-0"></app-friend-list>
          </div>
        </div>
        
      </div>
      
      <!-- Sección inferior: Friend Requests (altura fija) -->
      <div class="grid grid-cols-1 gap-6 flex-shrink-0">
        <div class="friend-requests-section">
          <app-friend-request></app-friend-request>
        </div>
      </div>

    </div>
  </main>
</div>
