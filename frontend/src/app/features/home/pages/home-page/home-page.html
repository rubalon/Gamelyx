<!-- src/app/features/home/pages/home-page/home-page.html-->
<div class="min-h-screen bg-gray-900 flex flex-col">
  
  <!-- Header reutilizable -->
  <app-header class="flex-shrink-0"></app-header>
  
  <!-- Contenido principal con layout de componentes sociales -->
  <main class="flex-1 flex flex-col pt-8 px-4 overflow-hidden">
    <div class="max-w-7xl mx-auto flex-1 flex flex-col overflow-hidden">
      
      <!-- Layout Grid Principal - ALTURA CALCULADA -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6 ">
        
        <!-- Columna Izquierda: Search + Friend Finder -->
        <div class="lg:col-span-8 flex flex-col space-y-6 ">
          
          <!-- 🔍 Search Toggle Component (altura fija) -->
          <div class="search-section flex-shrink-0">
            <app-search-toggle></app-search-toggle>
          </div>
          
          <!-- 🔍 Friend Finder Component (se expande) -->
          <div class="friend-finder-section flex-1 overflow-hidden">
            <app-friend-finder class="h-full"></app-friend-finder>
          </div>
          
        </div>
        
        <!-- Columna Derecha: Friend List - ALTURA FIJA -->
        <div class="lg:col-span-4 overflow-hidden h-[37.85rem]">
          <app-friend-list class="h-full"></app-friend-list>
        </div>
        
      </div>
      
      <!-- Sección inferior: Friend Requests (altura fija) -->
      <div class="flex-shrink-0">
        <app-friend-request></app-friend-request>
      </div>

    </div>
  </main>

  <!-- Footer reutilizable -->
  <app-footer class="pt-8  flex-shrink-0"></app-footer>
  
</div>
