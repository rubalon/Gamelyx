<section class="relative min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 overflow-hidden">
  
  <!-- Efecto de fondo animado -->
  <div class="absolute inset-0 opacity-20">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-xl animate-pulse"></div>
    <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl animate-pulse animation-delay-2000"></div>
    <div class="absolute bottom-1/4 left-1/3 w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-xl animate-pulse animation-delay-4000"></div>
  </div>
  
  <!-- Contenido principal -->
  <div class="relative z-10 text-center px-4 sm:px-6 lg:px-8 max-w-5xl mx-auto">
    
    <!-- Título principal -->
    <h1 class="text-5xl sm:text-6xl lg:text-7xl xl:text-8xl font-bold mb-6 leading-tight">
      <span class="bg-gradient-to-r from-white via-purple-200 to-blue-200 bg-clip-text text-transparent drop-shadow-2xl">
        Gamelyx
      </span>
    </h1>
    
    <!-- Subtítulo -->
    <p class="text-xl sm:text-2xl lg:text-3xl text-gray-300 mb-8 font-light max-w-3xl mx-auto leading-relaxed">
      {{ 'hero.subtitle' | translate }}
    </p>
    
    <!-- Descripción adicional -->
    <p class="text-lg text-gray-400 mb-12 max-w-2xl mx-auto leading-relaxed">
      {{ 'hero.description' | translate }}
    </p>
    
    <!-- Call to action buttons -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
      <button class="bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 text-white font-semibold py-4 px-8 rounded-xl text-lg transition-all duration-300 transform hover:scale-105 shadow-2xl hover:shadow-purple-500/25 min-w-48">
        {{ 'hero.cta.start' | translate }}
      </button>
      <button class="border-2 border-white/30 hover:border-white/50 text-white font-semibold py-4 px-8 rounded-xl text-lg transition-all duration-300 backdrop-blur-sm hover:backdrop-blur-md min-w-48">
        {{ 'hero.cta.learn' | translate }}
      </button>
    </div>
  </div>
  
  <!-- Indicador de scroll -->
  <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 text-white/60 animate-bounce">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
    </svg>
  </div>
</section>
