<!-- Overlay del modal -->
<div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 backdrop-blur-sm">
  
  <!-- Contenedor del modal -->
  <div class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 rounded-2xl shadow-2xl w-full max-w-md mx-4 relative border border-gray-700">
    
    <!-- Botón de cerrar -->
    <button 
      (click)="onCancel()" 
      class="absolute top-4 right-4 text-gray-400 hover:text-white transition-all duration-200 hover:scale-110 p-1 rounded-lg hover:bg-gray-700/50">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
    
    <!-- Contenido del modal -->
    <div class="p-8">
      
      <!-- Icono y título -->
      <div class="text-center mb-6">
        <!-- Icono -->
        <div class="mx-auto flex items-center justify-center w-16 h-16 rounded-full mb-4 bg-gradient-to-br from-red-500/20 via-pink-500/20 to-red-600/20 border border-red-500/30">
          <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1-1H8a1 1 0 00-1 1v3M4 7h16"></path>
          </svg>
        </div>
        
        <!-- Título -->
        <h2 class="text-2xl font-bold text-white mb-2">
          {{ title() }}
        </h2>
        
        <!-- Mensaje -->
        <p class="text-gray-300">
          {{ message() }}
        </p>
      </div>

      <!-- Botones de acción -->
      <div class="flex space-x-3">
        <!-- Botón Cancelar -->
        <button
          (click)="onCancel()"
          class="flex-1 px-4 py-3 bg-gradient-to-r from-gray-600 to-gray-700 hover:from-gray-500 hover:to-gray-600 text-white rounded-lg font-medium transition-all duration-200 hover:scale-105 active:scale-95 hover:shadow-lg">
          {{ cancelText() }}
        </button>
        
        <!-- Botón Confirmar -->
        <button
          (click)="onConfirm()"
          class="flex-1 px-4 py-3 bg-gradient-to-r from-red-500 to-pink-600 hover:from-red-600 hover:to-pink-700 text-white rounded-lg font-medium transition-all duration-200 hover:scale-105 active:scale-95 hover:shadow-lg">
          {{ confirmText() }}
        </button>
      </div>
      
    </div>
  </div>
  
</div>
