<header class="w-full bg-gray-900 shadow-lg border-b border-gray-800 sticky top-0 z-50">
  <div class="w-full px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16 w-full">
      
      <!-- Logo a la izquierda -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-gradient-to-br from-purple-600 to-blue-600 rounded-lg flex items-center justify-center shadow-lg">
          <span class="text-white font-bold text-lg">G</span>
        </div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-blue-400 bg-clip-text text-transparent">
          Gamelyx
        </h1>
      </div>
      
      <!-- Selector de idioma y botones de autenticación -->
      <div class="flex items-center space-x-4">
        
        <!-- Selector de idioma -->
        <div class="relative">
          <select 
            [value]="getCurrentLanguage()"
            (change)="changeLanguage($event)"
            class="bg-gray-800 text-white text-sm rounded-lg px-3 py-2 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent cursor-pointer"
          >
            <option value="es">🇪🇸 Español</option>
            <option value="en">🇺🇸 English</option>
          </select>
        </div>
        
        <!-- 👈 CONDICIONAL: Mostrar botón según estado de autenticación -->
        @if (!isAuthenticated) {
          <!-- Botón de Iniciar Sesión (cuando NO está logueado) -->
          <button 
            (click)="onLoginClick()"
            class="flex items-center space-x-2 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-all duration-200 transform hover:scale-105 shadow-lg hover:shadow-xl"
          >
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
            </svg>
            <span>{{ 'header.login' | translate }}</span>
          </button>
        } @else {
          <!-- Sección de usuario logueado (cuando SÍ está logueado) -->
          <div class="flex items-center space-x-3">
            
  
            <!-- Botón de Cerrar Sesión -->
            <button 
              (click)="onLogoutClick()"
              class="flex items-center space-x-2 bg-gradient-to-r from-purple-700 to-red-900 hover:from-purple-800 hover:to-red-700 text-white font-medium py-2 px-4 rounded-lg transition-all duration-200 transform hover:scale-105 shadow-lg hover:shadow-xl"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"></path>
              </svg>
              <span>{{ 'header.logout' | translate }}</span>
            </button>
          </div>
        }
        
      </div>
    </div>
  </div>
</header>
