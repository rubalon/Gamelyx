<header class="w-full bg-gray-900 shadow-lg border-b border-gray-800 sticky top-0 z-50">
  <div class="w-full px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16 w-full">
      
      <!-- Logo a la izquierda con efectos hover y navegación -->
      <div class="flex items-center space-x-3 cursor-pointer group" (click)="navigateToHome()">
        <!-- Icono con efectos hover -->
        <div class="w-10 h-10 bg-gradient-to-br from-purple-600 to-blue-600 rounded-lg flex items-center justify-center shadow-lg transition-all duration-300 group-hover:shadow-xl group-hover:shadow-purple-500/25 group-hover:scale-110 group-hover:rotate-3 group-active:scale-105">
          <span class="text-white font-bold text-lg transition-all duration-300 group-hover:text-purple-200">G</span>
        </div>
        <!-- Texto con efectos hover -->
        <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-blue-400 bg-clip-text text-transparent transition-all duration-300 group-hover:from-purple-300 group-hover:to-blue-300 group-hover:scale-105 select-none">
          Gamelyx
        </h1>
      </div>
      
      <!-- Desktop: Selector de idioma y botones (vista pc) -->
      <div class="hidden md:flex items-center space-x-4">
        
        <!-- Selector de idioma personalizado con imágenes -->
        <div class="relative">
          <button 
            (click)="toggleLanguageDropdown()"
            class="flex items-center space-x-2 bg-gray-800/50 rounded-lg px-3 py-2 border border-gray-700/50 hover:bg-gray-700/60 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent cursor-pointer transition-all duration-200 h-[50px]"
            aria-label="Select language"
          >
            <img 
              [src]="getCurrentLanguage() === 'es' ? 'assets/flags/es.svg' : 'assets/flags/gb.svg'"
              [alt]="getCurrentLanguage() === 'es' ? 'Español' : 'English'"
              class="w-8 h-6 object-cover rounded-sm"
            >
            <svg class="w-4 h-4 text-gray-400 transition-transform duration-200" 
                 [class.rotate-180]="isLanguageDropdownOpen"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>
          
          <!-- Dropdown de idiomas -->
          @if (isLanguageDropdownOpen) {
            <div class="absolute right-0 mt-2 bg-gray-800 border border-gray-600 rounded-lg shadow-xl z-50 overflow-hidden min-w-[140px]">
              <button 
                (click)="selectLanguage('es')"
                class="flex items-center space-x-3 w-full px-4 py-2.5 hover:bg-gray-700 transition-colors duration-150"
                [class.bg-gray-700]="getCurrentLanguage() === 'es'"
              >
                <img 
                  src="assets/flags/es.svg"
                  alt="Español"
                  class="w-6 h-4 object-cover rounded-sm"
                >
                <span class="text-sm text-white">Español</span>
              </button>
              <button 
                (click)="selectLanguage('en')"
                class="flex items-center space-x-3 w-full px-4 py-2.5 hover:bg-gray-700 transition-colors duration-150"
                [class.bg-gray-700]="getCurrentLanguage() === 'en'"
              >
                <img 
                  src="assets/flags/gb.svg"
                  alt="English"
                  class="w-6 h-4 object-cover rounded-sm"
                >
                <span class="text-sm text-white">English</span>
              </button>
            </div>
          }
        </div>
        
        <!-- Botones de autenticación -->
        @if (!isAuthenticated) {
          <!-- Botón de Iniciar Sesión -->
          <button 
            (click)="onLoginClick()"
            class="flex items-center space-x-2 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-all duration-200 transform hover:scale-105 shadow-lg hover:shadow-xl"
          >
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
            </svg>
            <span>{{ 'header.login' | translate }}</span>
          </button>
        } @else {
          <!-- Sección de usuario logueado -->
          <div class="flex items-center space-x-3">
            
            <!-- Info del usuario en desktop -->
            @if (currentUser) {
              <div class="flex items-center space-x-3 px-3 py-1.5 bg-gray-800/50 rounded-lg border border-gray-700/50 hover:bg-gray-800/70 transition-all duration-200">
                
                <!-- Avatar Component 👇 CAMBIO PRINCIPAL -->
                <app-avatar 
                  [username]="currentUser.username" 
                  sizeClasses="w-9 h-9 text-sm">
                </app-avatar>
                
                <!-- Nombre y email -->
                <div class=" lg:block">
                  <p class="text-white font-medium text-sm">{{ currentUser.username }}</p>
                  <p class="text-gray-400 text-xs">{{ currentUser.email }}</p>
                </div>
              </div>
              
              <!-- Separador vertical -->
              <div class="h-8 w-px bg-gray-700"></div>
            }
            
            <!-- Botón de Cerrar Sesión -->
            <button 
              (click)="onLogoutClick()"
              class="flex items-center space-x-2 bg-gradient-to-r from-purple-700 to-red-900 hover:from-purple-800 hover:to-red-700 text-white font-medium py-2 px-4 rounded-lg transition-all duration-200 transform hover:scale-105 shadow-lg hover:shadow-xl"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"></path>
              </svg>
              <span>{{ 'header.logout' | translate }}</span>
            </button>
          </div>
        }
      </div>

      <!-- Mobile: Botón de menú hamburguesa (visible solo en móvil) -->
      <button 
        (click)="toggleMobileMenu()"
        class="md:hidden flex items-center justify-center p-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all duration-200"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-label="Toggle menu"
      >
        @if (!isMobileMenuOpen) {
          <!-- Icono hamburguesa -->
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        } @else {
          <!-- Icono X (cerrar) -->
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        }
      </button>
    </div>

    <!-- Mobile Menu Dropdown (se muestra/oculta según isMobileMenuOpen) -->
    @if (isMobileMenuOpen) {
      <div class="md:hidden border-t border-gray-800 py-4 space-y-3 animate-slideDown">
        
        <!-- Selector de idioma móvil con banderas -->
        <div class="px-2">
          <label class="block text-xs text-gray-400 mb-2">{{ 'header.language' | translate }}</label>
          <div class="grid grid-cols-2 gap-2">
            <button 
              (click)="selectLanguage('es'); closeMobileMenu()"
              class="flex items-center justify-center space-x-2 px-3 py-2.5 rounded-lg border transition-all duration-200"
              [class.bg-gray-700]="getCurrentLanguage() === 'es'"
              [class.border-purple-500]="getCurrentLanguage() === 'es'"
              [class.border-gray-600]="getCurrentLanguage() !== 'es'"
              [class.hover:bg-gray-800]="getCurrentLanguage() !== 'es'"
            >
              <img 
                src="assets/flags/es.svg"
                alt="Español"
                class="w-6 h-4 object-cover rounded-sm"
              >
              <span class="text-sm text-white">ES</span>
            </button>
            <button 
              (click)="selectLanguage('en'); closeMobileMenu()"
              class="flex items-center justify-center space-x-2 px-3 py-2.5 rounded-lg border transition-all duration-200"
              [class.bg-gray-700]="getCurrentLanguage() === 'en'"
              [class.border-purple-500]="getCurrentLanguage() === 'en'"
              [class.border-gray-600]="getCurrentLanguage() !== 'en'"
              [class.hover:bg-gray-800]="getCurrentLanguage() !== 'en'"
            >
              <img 
                src="assets/flags/gb.svg"
                alt="English"
                class="w-6 h-4 object-cover rounded-sm"
              >
              <span class="text-sm text-white">EN</span>
            </button>
          </div>
        </div>

        <!-- Divider -->
        <div class="border-t border-gray-800 mx-2"></div>

        <!-- Botones de autenticación móvil -->
        <div class="px-2">
          @if (!isAuthenticated) {
            <!-- Botón de Iniciar Sesión móvil -->
            <button 
              (click)="onLoginClick(); closeMobileMenu()"
              class="w-full flex items-center justify-center space-x-2 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-all duration-200 shadow-lg active:scale-95"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
              </svg>
              <span>{{ 'header.login' | translate }}</span>
            </button>
          } @else {
            <!-- Información del usuario y botón de cerrar sesión móvil -->
            <div class="space-y-3">
              <!-- Info del usuario -->
              @if (currentUser) {
                <div class="flex items-center space-x-3 px-3 py-2 bg-gray-800 rounded-lg">
                  
                  <!-- Avatar Component 👇 CAMBIO MÓVIL -->
                  <app-avatar 
                    [username]="currentUser.username" 
                    sizeClasses="w-10 h-10 text-lg">
                  </app-avatar>
                  
                  <div class="flex-1">
                    <p class="text-white font-medium">{{ currentUser.username }}</p>
                    <p class="text-gray-400 text-xs">{{ currentUser.email }}</p>
                  </div>
                </div>
              }
              
              <!-- Botón de Cerrar Sesión móvil -->
              <button 
                (click)="onLogoutClick(); closeMobileMenu()"
                class="w-full flex items-center justify-center space-x-2 bg-gradient-to-r from-purple-700 to-red-900 hover:from-purple-800 hover:to-red-700 text-white font-medium py-3 px-4 rounded-lg transition-all duration-200 shadow-lg active:scale-95"
              >
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                  <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"></path>
                </svg>
                <span>{{ 'header.logout' | translate }}</span>
              </button>
            </div>
          }
        </div>
      </div>
    }
  </div>
</header>
