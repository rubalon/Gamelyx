<div class="relative max-w-2xl mx-auto">
      <!-- Search Input Container -->
      <div class="relative">
        <!-- Search Icon -->
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <svg class="h-6 w-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>

        <!-- Search Input -->
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (keyup.enter)="performSearch()"
          [placeholder]="'home.search.placeholder' | translate"
          [disabled]="isSearching()"
          class="w-full pl-12 pr-32 py-4 text-lg bg-gray-800 border-2 border-gray-700 rounded-xl
                 text-white placeholder-gray-400 focus:outline-none focus:border-purple-500
                 focus:ring-2 focus:ring-purple-500/20 transition-all duration-300
                 disabled:opacity-50 disabled:cursor-not-allowed"
        />

        <!-- Search Button -->
        <div class="absolute inset-y-0 right-0 pr-2 flex items-center">
          <button
            (click)="performSearch()"
            [disabled]="!searchQuery.trim() || isSearching()"
            class="px-6 py-2 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold
                   rounded-lg hover:from-purple-700 hover:to-blue-700 focus:outline-none
                   focus:ring-2 focus:ring-purple-500/50 transition-all duration-300
                   disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:from-purple-600
                   disabled:hover:to-blue-600"
          >
            @if (isSearching()) {
              <!-- Loading Spinner -->
              <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" 
                      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
              </svg>
            } @else {
              {{ 'home.search.button' | translate }}
            }
          </button>
        </div>
      </div>

      <!-- Error Message -->
      @if (searchError()) {
        <div class="mt-3 p-3 bg-red-900/50 border border-red-700 rounded-lg">
          <p class="text-red-300 text-sm">
            <svg class="inline h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            {{ searchError() }}
          </p>
        </div>
      }

      <!-- Search Hints -->
      <div class="mt-4 text-center">
        <p class="text-gray-400 text-sm">
          💡 {{ 'Try searching for games like "Minecraft", "GTA", "Zelda"...' }}
        </p>
      </div>
    </div>
