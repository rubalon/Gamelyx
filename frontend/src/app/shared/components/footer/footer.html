<!-- footer.html -->
<footer class="footer">
  <div class="footer-container">
    <!-- Línea superior con info principal -->
    <div class="footer-main">
      <!-- Info del proyecto -->
      <div class="project-info">
        <div class="project-badge">
          <i class="fas fa-graduation-cap"></i>
          <span>TFG Universidad de Jaén 2025</span>
        </div>
        <p class="author">Por <strong>Rubén Alonso Cruz</strong></p>
      </div>
      
      <!-- Tech stack inline -->
      <div class="tech-stack">
        <span class="built-with">Construido con</span>
        <div class="tech-badges">
          <div class="tech-badge">
            <img src="https://angular.io/assets/images/logos/angular/angular.svg" alt="Angular" class="tech-icon">
            <span>Angular 20</span>
          </div>
          <div class="tech-badge">
            <img src="https://spring.io/img/spring-2.svg" alt="Spring Boot" class="tech-icon">
            <span>Spring Boot 3.5.3</span>
          </div>
        </div>
      </div>
      
      <!-- Enlaces -->
      <div class="footer-links">
        <!-- LinkedIn -->
        <a 
          href="https://www.linkedin.com/in/tu-perfil" 
          target="_blank" 
          rel="noopener noreferrer"
          class="linkedin-btn"
          (click)="openLinkedIn()"
        >
          <i class="fab fa-linkedin"></i>
        </a>
      </div>
    </div>
    
    <!-- Attribution y Copyright en una línea -->
    <div class="footer-bottom">
      <div class="attribution">
        <span>Datos proporcionados por</span>
        <a 
          href="https://rawg.io"
          target="_blank"
          rel="noopener noreferrer"
          class="rawg-link"
        >
          <i class="fas fa-star"></i>
          <span>RAWG Video Games Database</span>
          <i class="fas fa-external-link-alt"></i>
        </a>
      </div>
      <div class="copyright">
        <span>&copy; {{getCurrentYear()}} Gamelyx. Todos los derechos reservados.</span>
      </div>
    </div>
  </div>
</footer>
